<!-- templates/index.html -->
{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center py-5">
            <img src="{{ url_for('static', filename='mtsu_logo.svg') }}" alt="MTSU Logo" style="height: 120px; margin-bottom: 30px;">
            
            <div class="card shadow-lg" style="border: none; border-radius: 15px; overflow: hidden;">
                <div class="card-header text-white p-4" style="background: linear-gradient(135deg, #0066CC, #75B2DD);">
                    <h1 class="display-5 mb-0">MTSU Academic Management</h1>
                    <p class="lead mb-0">Database Security System</p>
                </div>
                <div class="card-body p-4">
                    <div class="d-grid gap-3 col-md-6 mx-auto mt-3">
                        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg" style="background-color: #0066CC; border-color: #0066CC; padding: 12px 25px; border-radius: 8px;">
                            Login to System
                        </a>
                    </div>
                    
                    <div class="mt-4">
                        <div class="row text-center">
                            <div class="col-md-4">
                                <i class="bi bi-shield" style="font-size: 2rem; color: #0066CC;"></i>
                                <h5 class="mt-2">RBAC Security</h5>
                            </div>
                            <div class="col-md-4">
                                <i class="bi bi-database" style="font-size: 2rem; color: #0066CC;"></i>
                                <h5 class="mt-2">Data Protection</h5>
                            </div>
                            <div class="col-md-4">
                                <i class="bi bi-clock" style="font-size: 2rem; color: #0066CC;"></i>
                                <h5 class="mt-2">Audit Logging</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="text-muted mt-4">© 2025 Middle Tennessee State University</p>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
{% endblock %}
